site_name: Proxmox Homelab
site_url: https://yourusername.github.io/proxmox-homelab/
theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest
    - content.code.copy
    - content.tooltips
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
nav:
  - Home: index.md
  - Architecture:
      - Overview: 01-architecture/overview.md
      - Hardware: 01-architecture/hardware.md
      - Network: 01-architecture/network.md
  - Proxmox:
      - Installation: 02-proxmox/installation.md
      - Storage: 02-proxmox/storage.md
      - LXC: 02-proxmox/lxc.md
      - Backups: 02-proxmox/backups.md
  - Networking:
      - Bridge (vmbr0): 03-networking/vmbr0.md
      - Cloudflare Tunnel: 03-networking/cloudflare-tunnel.md
      - Firewall: 03-networking/firewall.md
  - Identity:
      - OpenLDAP: 04-identity/openldap.md
      - Authelia: 04-identity/authelia.md
      - OIDC: 04-identity/oidc.md
      - SSO Flow: 04-identity/sso-flow.md
  - Services:
      - Nginx: 05-services/nginx.md
      - Gitea: 05-services/gitea.md
      - Grafana: 05-services/grafana.md
      - Prometheus: 05-services/prometheus.md
  - Security:
      - SSH Hardening: 06-security/ssh-hardening.md
      - Firewall Matrix: 06-security/firewall-matrix.md
      - TLS: 06-security/tls.md
      - Checklist: 06-security/security-checklist.md
  - Monitoring:
      - Prometheus: 07-monitoring/prometheus.md
      - Grafana Dashboards: 07-monitoring/grafana-dashboards.md
  - Automation:
      - Ansible: 08-automation/ansible.md
  - Backups:
      - Strategy: 09-backups/strategy.md
      - Disaster Recovery: 09-backups/disaster-recovery.md
  - Lessons Learned: 10-lessons-learned.md
  - License: license.md
