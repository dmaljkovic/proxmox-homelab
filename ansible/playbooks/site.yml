---
- name: Base system + node_exporter (all hosts)
  hosts: all
  become: true
  roles:
    - base
    - node_exporter

- name: Configure Nginx reverse proxy
  hosts: nginx
  become: true
  roles:
    - nginx

- name: Configure Prometheus
  hosts: prometheus
  become: true
  roles:
    - prometheus

- name: Configure Grafana
  hosts: grafana
  become: true
  roles:
    - grafana

- name: Service-level backups (Proxmox host)
  hosts: proxmox
  become: true
  roles:
    - backup
  tags: [backup]

