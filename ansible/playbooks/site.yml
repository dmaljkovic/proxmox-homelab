---
- name: Base system + node_exporter (all hosts)
  hosts: all
  become: true
  roles:
    - base
    - node_exporter

- name: Configure Nginx reverse proxy
  hosts: nginx
  become: true
  roles:
    - nginx

- name: Configure Prometheus
  hosts: prometheus
  become: true
  roles:
    - prometheus

- name: Configure Grafana
  hosts: grafana
  become: true
  roles:
    - grafana

# TODO (next increment): openldap, authelia, gitea, proxmox-host roles.
