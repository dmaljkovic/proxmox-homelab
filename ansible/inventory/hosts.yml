---
all:
  vars:
    ansible_user: root
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    domain: example.com
    tunnel_id: "<TUNNEL_ID_PLACEHOLDER>"
  
  children:
    proxmox:
      hosts:
        proxmox-host:
          ansible_host: 10.0.0.99
    
    lxc_containers:
      children:
        nginx:
          hosts:
            nginx:
              ansible_host: 10.0.0.10
              vmid: 101
        openldap:
          hosts:
            openldap:
              ansible_host: 10.0.0.20
              vmid: 102
        authelia:
          hosts:
            authelia:
              ansible_host: 10.0.0.30
              vmid: 103
        gitea:
          hosts:
            gitea:
              ansible_host: 10.0.0.40
              vmid: 104
        grafana:
          hosts:
            grafana:
              ansible_host: 10.0.0.50
              vmid: 105
        prometheus:
          hosts:
            prometheus:
              ansible_host: 10.0.0.60
              vmid: 106

    web_services:
      children:
        nginx:
        gitea:
        grafana:
        authelia:

    identity:
      children:
        openldap:
        authelia:

    monitoring:
      children:
        prometheus:
        grafana:
