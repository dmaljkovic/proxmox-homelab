---
- name: Determine node_exporter architecture
  ansible.builtin.set_fact:
    node_exporter_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

# /var/cache, not /tmp — a partial /tmp cleanup used to force a re-download and
# re-extract on every run, because both artifacts lived in a volatile directory.
- name: Ensure node_exporter cache directory
  ansible.builtin.file:
    path: /var/cache/node_exporter
    state: directory
    owner: root
    group: root
    mode: "0755"

# check_mode: false — the tarball is a prerequisite for the install task below,
# which cannot be simulated in check mode.
- name: Download node_exporter tarball
  ansible.builtin.get_url:
    url: >-
      https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz
    dest: "/var/cache/node_exporter/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    mode: "0644"
  check_mode: false

- name: Create node_exporter system user
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# creates: anchors idempotency on the installed binary rather than on a
# scratch directory, so a cleaned-up cache never causes a needless change.
- name: Install node_exporter binary
  ansible.builtin.unarchive:
    src: "/var/cache/node_exporter/node_exporter-{{ node_exporter_version }}.linux-{{ node_exporter_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: "0755"
    extra_opts: [--strip-components=1]
    creates: node_exporter
  notify: Restart node_exporter
  check_mode: false

- name: Deploy node_exporter systemd unit
  ansible.builtin.template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart node_exporter

- name: Enable and start node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true
